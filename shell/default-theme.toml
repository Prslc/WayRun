# ~/.config/wayrun/theme.toml — every key is optional; commented keys keep the default.

[colors]
# primary = "#7aa2f7"        # accent: selection tint, accent bar, panel header
# fg = "#c0caf5"             # text, icons and hint tints
# container = "#24283b"      # card fill
# dim = "#0000004d"          # backdrop dim (this surface takes #RRGGBBAA)

[colors.dark]
# fg = "#c0caf5"             # dark-only override, layered on [colors]

[colors.light]
# fg = "#1f2430"             # light-only override, layered on [colors]

[surfaces]
# each surface derives from a role; set color, alpha or both to pin it
# card = { alpha = 0.85 }              # card fill; color follows container (0.72 light)
# selection = { color = "#7aa2f7", alpha = 0.15 } # selected-row tint
# hover = { alpha = 0.08 }             # pointer hover tint
# preview = { alpha = 0.05 }           # split view's tonal pane
# hairline = { width = 1.0 }       # card edge; 0 hides it (black at 0.10 light, white at 0.12 dark)
# muted = { alpha = 0.55 }             # placeholder and hint text
# summary = { alpha = 0.70 }           # a row's second line
# footer = { alpha = 0.50 }            # footer text
# accent = { color = "#7aa2f7" }       # selected row's accent bar
# dim = { color = "#000000", alpha = 0.30 } # backdrop; overrides [colors] dim

[surfaces.dark]
# hairline = { color = "#ffffff" }     # dark-only surface, layered on [surfaces]

[surfaces.light]
# hairline = { color = "#000000" }     # light-only surface, layered on [surfaces]

[blur]
# enabled = true             # declare the card's rounded rect as a blur region

[preview]
# enabled = true             # show the split preview column for a selected row

[footer]
# enabled = true             # show the hint bar under the results

[layout]
# width = 730.0              # card width in pixels; a narrower output shrinks it
# radius = 16.0              # card corner radius; 0 is square corners
# top_ratio = 0.20           # the card's top edge, as a fraction of the output height
# align = "center"           # horizontal anchor: left / center / right
# max_rows = 5               # visible result rows
# panel_header = 28.0        # action panel header band height

[font]
# size = 14.0                # interface size; roles scale by their shipped ratio

[motion]
# reduced = false            # start both animations at their end state
