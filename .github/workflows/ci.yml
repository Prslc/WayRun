name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            libglib2.0-dev \
            libsqlite3-dev \
            fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --all --all-features --locked

      # niri-only is the default build below; these pin the two remaining combos.
      - name: cargo check (feature combos)
        run: |
          cargo check --locked -p wayrun-shell --no-default-features --features compositor-hyprland
          cargo check --locked -p wayrun-shell --no-default-features

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Package
        run: |
          tar -czf "wayrun-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release wayrun

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: wayrun-x86_64-unknown-linux-gnu
          path: wayrun-x86_64-unknown-linux-gnu.tar.gz
          archive: false
          if-no-files-found: error
