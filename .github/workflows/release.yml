name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            libglib2.0-dev \
            libsqlite3-dev \
            fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Package
        run: |
          tar -czf "wayrun-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release wayrun \
            -C "${GITHUB_WORKSPACE}/core/assets/icons" NOTICE

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            if [ -s RELEASE_NOTES.md ]; then
              gh release create "${{ github.ref_name }}" \
                --title "WayRun ${{ github.ref_name }}" \
                --notes-file RELEASE_NOTES.md
            else
              gh release create "${{ github.ref_name }}" \
                --title "WayRun ${{ github.ref_name }}" --generate-notes
            fi
          fi
          gh release upload "${{ github.ref_name }}" wayrun-*.tar.gz --clobber
