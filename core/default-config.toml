# ~/.config/wayrun/config.toml — every key is optional; commented keys keep the default.

[ui]
# locale = "zh_cn"             # interface language; omitted follows the session locale

[web_search]
# engine = "google"             # suggestion backend: google or duckduckgo

[font]
# family = "Source Han Sans CN" # primary shaping family; a change needs a restart

[icon]
# theme = "Adwaita"             # icon theme; omitted follows the desktop setting

[files]
# index = true                  # match f/d at any depth under $HOME
# depth = 3                     # levels the search descends while unindexed; 1-16
exclude = ["node_modules", "target", "__pycache__"] # the walk skips these; dot-prefixed names (.git) too
