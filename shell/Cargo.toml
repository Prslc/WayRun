[package]
name = "wayrun-shell"
version = "0.2.0"
edition = "2024"

# One artifact: the shell includes the core and re-runs itself with `--core`.
[[bin]]
name = "wayrun"
path = "src/main.rs"

# Compositor backends are a compile-time toggle; forward them so a build of
# `wayrun` can drop the default. `hyprland` is experimental.
[features]
default = ["compositor-niri"]
compositor-niri = ["wayrun-core/compositor-niri"]
compositor-hyprland = ["wayrun-core/compositor-hyprland"]

[dependencies]
wayrun-core = { path = "../core", default-features = false }
calloop = "0.14"
calloop-wayland-source = "0.4"
cosmic-text = "0.15"
env_logger = { version = "0.11", default-features = false }
libc = "0.2"
notify = "8.2"
# Icons are paths, never text: the default `text`/`system-fonts` features would
# build and load a system font database for every `Options::default()`, which
# maps tens of MB of font files the shell never draws with.
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.11.4"
toml = "1.1.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
