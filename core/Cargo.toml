[package]
name = "wayrun-core"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["compositor-niri"]
compositor-niri = []
compositor-hyprland = []

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
fasteval = "0.2.4"
gio = "0.22.9"
libc = "0.2"
memchr = "2.8.3"
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
notify = "8.2"
rusqlite = "0.38.0"
rust-i18n = { version = "1.2.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time"] }
toml = "1.1.2"
urlencoding = "2"
walkdir = "2.5.0"
freedesktop-desktop-entry = { version = "0.8", default-features = false }
memmap2 = "0.9"
minreq = { version = "3.0.0", default-features = false, features = ["https-native-tls", "json-using-serde", "urlencoding", "proxy"] }
rayon = "1.12.0"

[dev-dependencies]
tempfile = "3.26.0"
