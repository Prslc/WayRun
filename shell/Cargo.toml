[package]
name = "wayrun-shell"
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# One artifact: the shell includes the core and re-runs itself with `--core`.
[[bin]]
name = "wayrun"
path = "src/main.rs"

[dependencies]
wayrun-core = { path = "../core" }
wayrun-ui = { path = "../ui" }
anyhow = "1.0.102"
calloop = "0.14"
calloop-wayland-source = "0.4"
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
libc = "0.2"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.11.4"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
